<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dwellia — Action Item Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600;9..40,700;9..40,800&family=DM+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --blue:      #1179EB;
      --blue-lt:   #EBF4FF;
      --blue-mid:  rgba(17,121,235,0.11);
      --orange:    #F38B2B;
      --orange-lt: #FFF4E8;
      --bg:        #E8EAF0;
      --white:     #FFFFFF;
      --border:    rgba(0,0,0,0.07);
      --text:      #1a1d20;
      --text-2:    #6b7280;
      --text-3:    #9ca3af;
      --green:     #15803d;
      --green-lt:  rgba(21,128,61,0.09);
      --red:       #dc2626;
      --red-lt:    rgba(220,38,38,0.09);
      --amber:     #b45309;
      --amber-lt:  rgba(180,83,9,0.09);
      --radius:    14px;
      --radius-sm: 9px;
      --shadow:    0 1px 3px rgba(0,0,0,0.06), 0 2px 12px rgba(0,0,0,0.04);
      --shadow-h:  0 4px 10px rgba(0,0,0,0.09), 0 12px 28px rgba(17,121,235,0.12);
    }

    body { background: var(--bg); color: var(--text); font-family: 'DM Sans', sans-serif; font-size: 14px; min-height: 100vh; }

    /* Header */
    .header {
      background: #fff;
      border-bottom: 1px solid var(--border);
      padding: 0 20px;
      height: 54px;
      display: grid;
      grid-template-columns: auto 1fr auto;
      align-items: center;
      gap: 12px;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .header-center {
      text-align: center;
      font-size: 18px;
      font-weight: 500;
      color: var(--blue);
      letter-spacing: -0.3px;
      font-family: 'DM Sans', sans-serif;
    }
    .header-right { display: flex; align-items: center; gap: 8px; justify-content: flex-end; }
    .live-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--green); animation: pulse 2s infinite; flex-shrink: 0; }
    .live-label { font-size: 11px; font-weight: 600; color: var(--text-2); }
    @keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:0.35; } }

    /* Time toggle */
    .time-toggle { display: flex; gap: 4px; background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 3px; flex-wrap: wrap; justify-content: center; }
    .tt-btn { padding: 4px 10px; border-radius: 6px; border: none; background: none; font-size: 11px; font-weight: 600; color: var(--text-3); cursor: pointer; font-family: 'DM Sans', sans-serif; transition: all 0.13s; letter-spacing: 0.02em; white-space: nowrap; }
    .tt-btn.active { background: #fff; color: var(--blue); box-shadow: var(--shadow); }

    /* Layout */
    .page { padding: 22px 28px 48px; }
    .grid { display: grid; grid-template-columns: repeat(12, 1fr); gap: 14px; }
    .c3  { grid-column: span 3; }
    .c4  { grid-column: span 4; }
    .c6  { grid-column: span 6; }
    .c8  { grid-column: span 8; }
    .c12 { grid-column: span 12; }

    /* Section headers */
    .section-block { padding: 22px 0 0; }
    .sh { display: flex; align-items: center; gap: 12px; margin-bottom: 13px; flex-wrap: wrap; }
    .sh-label { font-size: 10px; font-weight: 800; letter-spacing: 0.10em; text-transform: uppercase; color: var(--text-3); white-space: nowrap; }
    .sh-rule { flex: 1; height: 1px; background: rgba(0,0,0,0.09); min-width: 20px; }

    /* Cards */
    .card { background: #fff; border: 1px solid var(--border); border-radius: var(--radius); padding: 18px 20px; box-shadow: var(--shadow); position: relative; }
    .clabel { font-size: 10px; font-weight: 700; letter-spacing: 0.07em; text-transform: uppercase; color: var(--text-3); margin-bottom: 12px; }
    .clabel.blue { color: var(--blue); }
    .cvalue { font-family: 'DM Mono', monospace; font-size: 28px; font-weight: 600; line-height: 1; letter-spacing: -0.02em; margin-bottom: 3px; }
    .cvalue.blue   { color: var(--blue); }
    .cvalue.green  { color: var(--green); }
    .cvalue.red    { color: var(--red); }
    .csub { font-size: 11px; color: var(--text-3); font-weight: 500; }

    /* Chart */
    .chart-wrap { position: relative; height: 190px; }

    /* Filters */
    .filters-row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    .filter-group { display: flex; align-items: center; gap: 6px; }
    .filter-group label { font-size: 10px; font-weight: 700; letter-spacing: 0.07em; text-transform: uppercase; color: var(--text-3); white-space: nowrap; }
    select { background: #fff; border: 1px solid var(--border); color: var(--text); padding: 5px 10px; border-radius: var(--radius-sm); font-size: 12px; font-family: 'DM Sans', sans-serif; font-weight: 500; cursor: pointer; box-shadow: var(--shadow); }
    select:focus { outline: 2px solid var(--blue-mid); }

    /* Badges */
    .badge { display: inline-flex; align-items: center; gap: 3px; padding: 2px 8px; border-radius: 20px; font-size: 10.5px; font-weight: 600; white-space: nowrap; }
    .badge.green   { background: var(--green-lt); color: var(--green); }
    .badge.red     { background: var(--red-lt); color: var(--red); }
    .badge.blue    { background: var(--blue-mid); color: var(--blue); }
    .badge.orange  { background: var(--orange-lt); color: var(--orange); }
    .badge.gray    { background: rgba(107,114,128,0.09); color: #6b7280; }
    .badge.teal    { background: rgba(13,148,136,0.09); color: #0d9488; }

    /* Property tags */
    .tprop    { font-size: 10px; font-weight: 700; padding: 2px 6px; border-radius: 4px; text-transform: uppercase; letter-spacing: 0.04em; }
    .tprop.dd { background: var(--blue-lt); color: var(--blue); }
    .tprop.lg { background: var(--orange-lt); color: var(--orange); }

    /* Table */
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; }
    thead th { padding: 9px 14px; text-align: left; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.07em; color: var(--text-3); background: var(--bg); border-bottom: 1px solid var(--border); }
    tbody tr { border-bottom: 1px solid rgba(0,0,0,0.05); cursor: pointer; transition: background 0.1s; }
    tbody tr:last-child { border-bottom: none; }
    tbody tr:hover { background: #F5F7FF; }
    tbody td { padding: 11px 14px; font-size: 13px; vertical-align: middle; }
    .truncate { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 220px; display: block; color: var(--text-2); font-size: 12px; }
    .td-date { font-family: 'DM Mono', monospace; font-size: 11.5px; color: var(--text-3); white-space: nowrap; }

    /* Delete btn */
    .del-btn { background: none; border: 1px solid var(--border); color: var(--text-3); border-radius: 6px; padding: 2px 7px; cursor: pointer; font-size: 11px; transition: all 0.12s; }
    .del-btn:hover { border-color: var(--red); color: var(--red); background: var(--red-lt); }

    /* Empty / loading */
    .empty-state { padding: 48px 20px; text-align: center; color: var(--text-3); }
    .empty-state .icon { font-size: 36px; margin-bottom: 10px; }
    .empty-state p { font-size: 13px; font-weight: 500; }
    .loading-state { padding: 48px 20px; text-align: center; color: var(--text-3); font-size: 13px; font-weight: 500; }

    /* Modal */
    .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 200; align-items: center; justify-content: center; padding: 24px; backdrop-filter: blur(2px); }
    .modal-overlay.open { display: flex; }
    .modal { background: #fff; border: 1px solid var(--border); border-radius: var(--radius); max-width: 580px; width: 100%; max-height: 85vh; overflow-y: auto; box-shadow: 0 20px 60px rgba(0,0,0,0.15); }
    .modal-head { padding: 18px 22px 16px; border-bottom: 1px solid var(--border); display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; }
    .modal-head h2 { font-size: 15px; font-weight: 700; line-height: 1.4; color: var(--text); }
    .modal-close { background: var(--bg); border: none; color: var(--text-2); font-size: 14px; cursor: pointer; border-radius: 6px; width: 26px; height: 26px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .modal-close:hover { background: var(--red-lt); color: var(--red); }
    .modal-body { padding: 18px 22px; display: flex; flex-direction: column; gap: 12px; }
    .reasoning-box { background: var(--blue-lt); border-left: 3px solid var(--blue); padding: 10px 13px; border-radius: 0 var(--radius-sm) var(--radius-sm) 0; font-size: 12.5px; line-height: 1.5; font-style: italic; color: #1a1d20; }
    .detail-row { display: grid; grid-template-columns: 130px 1fr; gap: 8px; align-items: baseline; padding: 6px 0; border-bottom: 1px solid rgba(0,0,0,0.04); }
    .detail-row:last-child { border-bottom: none; }
    .dlabel { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.07em; color: var(--text-3); }
    .dval { font-size: 13px; color: var(--text); }
    .asana-link { color: var(--blue); text-decoration: none; font-size: 13px; font-weight: 600; }
    .asana-link:hover { text-decoration: underline; }

    /* Animations */
    @keyframes fadeUp { from { opacity:0; transform: translateY(10px); } to { opacity:1; transform:translateY(0); } }
    .grid > * { animation: fadeUp 0.32s ease both; }
    .grid > *:nth-child(1) { animation-delay:.04s; }
    .grid > *:nth-child(2) { animation-delay:.08s; }
    .grid > *:nth-child(3) { animation-delay:.11s; }
    .grid > *:nth-child(4) { animation-delay:.14s; }
    .grid > *:nth-child(5) { animation-delay:.17s; }
    .grid > *:nth-child(6) { animation-delay:.20s; }

    /* Responsive */
    @media (max-width: 1100px) { .c3, .c4 { grid-column: span 6; } }
    @media (max-width: 768px) {
      .c3,.c4,.c6,.c8 { grid-column: span 12; }
      .page { padding: 14px 12px 48px; }
      .header { padding: 0 12px; height: 50px; }
      .header-center { font-size: 14px; }
      .header-logo img { height: 24px; }
      /* Mobile filters — stack vertically in their own card */
      .filters-row { flex-direction: column; align-items: flex-start; gap: 8px; }
      .filter-group { width: 100%; }
      .filter-group select { flex: 1; width: 100%; }
      /* Hide last-updated on mobile */
      .last-updated { display: none; }
    }
  </style>
</head>
<body>

<header class="header">
  <div class="header-logo">
    <img src="https://bookdwellia.com/d-logo.png" alt="Dwellia" height="28">
  </div>
  <div class="header-center">HostBuddy Action Items</div>
  <div class="header-right">
    <div class="live-dot"></div>
    <span class="live-label">Live</span>
    <span class="last-updated" id="lastUpdated"></span>
  </div>
</header>

<div class="page">

  <!-- Time toggle -->
  <div style="display:flex;justify-content:center;padding:18px 0 6px;">
    <div class="time-toggle" id="timeToggle"></div>
  </div>

  <!-- Stats -->
  <div class="section-block" style="padding-top:0;">
    <div class="sh"><span class="sh-label">Overview</span><div class="sh-rule"></div></div>
    <div class="grid" id="statsGrid">
      <div class="loading-state c12">Loading...</div>
    </div>
  </div>

  <!-- Charts -->
  <div class="section-block">
    <div class="sh"><span class="sh-label">Breakdown</span><div class="sh-rule"></div></div>
    <div class="grid">
      <div class="card c4">
        <div class="clabel blue">By Category</div>
        <div class="chart-wrap"><canvas id="chartCategory"></canvas></div>
      </div>
      <div class="card c4">
        <div class="clabel blue">By Property</div>
        <div class="chart-wrap"><canvas id="chartProperty"></canvas></div>
      </div>
      <div class="card c4" id="repeatIssuesCard" style="overflow-y:auto;max-height:270px;">
        <div class="clabel blue">Repeat Issues</div>
        <div style="padding:24px 0;text-align:center;color:var(--text-3);font-size:12px;">Loading...</div>
      </div>
    </div>
  </div>

  <!-- Issue Log -->
  <div class="section-block">
    <div class="sh">
      <span class="sh-label">Issue Log</span>
      <div class="sh-rule"></div>
      <!-- Filters inline on desktop, stacked on mobile -->
      <div class="filters-row">
        <div class="filter-group">
          <label>Property</label>
          <select id="filterProperty">
            <option value="all">All</option>
            <option value="delta-dawn">Delta Dawn</option>
            <option value="legobii">LeGobi Villa</option>
          </select>
        </div>
        <div class="filter-group">
          <label>Category</label>
          <select id="filterCategory">
            <option value="all">All</option>
            <option>CLEANLINESS</option>
            <option>GUEST REQUESTS</option>
            <option>MAINTENANCE</option>
            <option>SUPPLY</option>
            <option>OTHER</option>
          </select>
        </div>
        <div class="filter-group">
          <label>Type</label>
          <select id="filterType">
            <option value="all">All</option>
            <option value="urgent">Urgent</option>
            <option value="next_clean">Next Clean</option>
            <option value="none">No Action</option>
          </select>
        </div>
      </div>
      <span id="issueCount" style="font-size:11px;font-weight:600;color:var(--text-3);white-space:nowrap;"></span>
    </div>
    <div class="card c12" style="padding:0;overflow:hidden;">
      <div id="tableContent"><div class="loading-state">Loading...</div></div>
    </div>
  </div>

</div>

<!-- Modal -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <div class="modal-head">
      <h2 id="modalTitle"></h2>
      <button class="modal-close" id="modalClose">&#x2715;</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

<script src="dashboard.js"></script>
</body>
</html>
