<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dwellia — Action Item Dashboard</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0f1117; --surface: #1a1d27; --surface2: #22263a; --border: #2e3352;
      --text: #e8eaf6; --muted: #7b82a8; --accent: #6c8ef5; --green: #4caf7d;
      --orange: #f5a623; --red: #e05c5c; --dd: #6c8ef5; --lg: #a78bfa;
    }
    body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 14px; min-height: 100vh; }
    header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 16px 32px; display: flex; align-items: center; justify-content: space-between; }
    header h1 { font-size: 18px; font-weight: 600; display: flex; align-items: center; gap: 10px; }
    .logo { background: var(--accent); color: #fff; font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 4px; letter-spacing: 0.5px; }
    .last-updated { font-size: 12px; color: var(--muted); }
    .filters { padding: 16px 32px; display: flex; gap: 12px; align-items: center; background: var(--surface); border-bottom: 1px solid var(--border); flex-wrap: wrap; }
    .filters label { font-size: 12px; color: var(--muted); }
    select { background: var(--surface2); border: 1px solid var(--border); color: var(--text); padding: 6px 10px; border-radius: 6px; font-size: 13px; cursor: pointer; }
    .main { padding: 24px 32px; display: flex; flex-direction: column; gap: 24px; }
    .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 16px; }
    .stat-card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 20px; }
    .stat-card .label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.8px; color: var(--muted); margin-bottom: 8px; }
    .stat-card .value { font-size: 32px; font-weight: 700; line-height: 1; }
    .stat-card .sub { font-size: 12px; color: var(--muted); margin-top: 6px; }
    .stat-card.accent .value { color: var(--accent); }
    .stat-card.green .value { color: var(--green); }
    .stat-card.orange .value { color: var(--orange); }
    .charts { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; }
    @media (max-width: 900px) { .charts { grid-template-columns: 1fr 1fr; } }
    @media (max-width: 600px) { .charts { grid-template-columns: 1fr; } }
    .chart-card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 20px; }
    .chart-card h3 { font-size: 13px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.6px; margin-bottom: 16px; }
    .chart-wrap { position: relative; height: 200px; }
    .table-card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
    .table-header { padding: 16px 20px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
    .table-header h3 { font-size: 14px; font-weight: 600; }
    .count { font-size: 12px; color: var(--muted); background: var(--surface2); padding: 3px 8px; border-radius: 20px; }
    table { width: 100%; border-collapse: collapse; }
    thead th { padding: 10px 16px; text-align: left; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.6px; color: var(--muted); background: var(--surface2); border-bottom: 1px solid var(--border); }
    tbody tr { border-bottom: 1px solid var(--border); cursor: pointer; transition: background 0.1s; }
    tbody tr:last-child { border-bottom: none; }
    tbody tr:hover { background: var(--surface2); }
    tbody td { padding: 12px 16px; font-size: 13px; vertical-align: top; max-width: 280px; }
    .truncate { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 240px; display: block; }
    .badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.4px; white-space: nowrap; }
    .badge-dd { background: rgba(108,142,245,0.15); color: var(--dd); }
    .badge-lg { background: rgba(167,139,250,0.15); color: var(--lg); }
    .badge-urgent { background: rgba(224,92,92,0.15); color: var(--red); }
    .badge-nextclean { background: rgba(76,175,125,0.15); color: var(--green); }
    .badge-no { background: rgba(123,130,168,0.1); color: var(--muted); }
    .badge-cat { background: rgba(245,166,35,0.12); color: var(--orange); font-size: 10px; }
    .delete-btn { background: none; border: 1px solid var(--border); color: var(--muted); border-radius: 4px; padding: 2px 7px; cursor: pointer; font-size: 12px; transition: all 0.1s; }
    .delete-btn:hover { border-color: var(--red); color: var(--red); }
    .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 100; align-items: center; justify-content: center; padding: 24px; }
    .modal-overlay.open { display: flex; }
    .modal { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; max-width: 640px; width: 100%; max-height: 80vh; overflow-y: auto; }
    .modal-head { padding: 20px 24px 16px; border-bottom: 1px solid var(--border); display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; }
    .modal-head h2 { font-size: 16px; font-weight: 600; line-height: 1.4; }
    .modal-close { background: none; border: none; color: var(--muted); font-size: 20px; cursor: pointer; line-height: 1; padding: 2px; flex-shrink: 0; }
    .modal-close:hover { color: var(--text); }
    .modal-body { padding: 20px 24px; display: flex; flex-direction: column; gap: 16px; }
    .detail-row { display: grid; grid-template-columns: 140px 1fr; gap: 8px; align-items: baseline; }
    .detail-label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.6px; color: var(--muted); font-weight: 600; }
    .detail-value { font-size: 13px; line-height: 1.5; }
    .asana-link { color: var(--accent); text-decoration: none; font-size: 13px; }
    .asana-link:hover { text-decoration: underline; }
    .reasoning-box { background: var(--surface2); border-left: 3px solid var(--accent); padding: 12px 14px; border-radius: 0 6px 6px 0; font-size: 13px; line-height: 1.5; font-style: italic; }
    .empty { padding: 60px 20px; text-align: center; color: var(--muted); }
    .empty .icon { font-size: 40px; margin-bottom: 12px; }
    .loading { padding: 60px 20px; text-align: center; color: var(--muted); font-size: 14px; }
  </style>
</head>
<body>

<header>
  <h1><span class="logo">DWELLIA</span> Action Item Dashboard</h1>
  <span class="last-updated" id="lastUpdated">Loading...</span>
</header>

<div class="filters">
  <label>Property</label>
  <select id="filterProperty">
    <option value="all">All Properties</option>
    <option value="delta-dawn">Delta Dawn</option>
    <option value="legobii">LeGobi Villa</option>
  </select>
  <label>Category</label>
  <select id="filterCategory">
    <option value="all">All Categories</option>
    <option>CLEANLINESS</option>
    <option>GUEST REQUESTS</option>
    <option>MAINTENANCE</option>
    <option>RESERVATION CHANGES</option>
    <option>SUPPLY</option>
    <option>OTHER</option>
  </select>
  <label>Type</label>
  <select id="filterType">
    <option value="all">All Types</option>
    <option value="urgent">Urgent</option>
    <option value="next_clean">Next Clean</option>
    <option value="none">No Action</option>
  </select>
</div>

<div class="main">
  <div id="content"><div class="loading">Loading issues...</div></div>
</div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal" id="modal">
    <div class="modal-head">
      <h2 id="modalTitle"></h2>
      <button class="modal-close" id="modalClose">&#x2715;</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

<script src="dashboard.js"></script>
</body>
</html>
